<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Termosifone's Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f5f2;
            color: #333;
        }

        .title-font {
            font-family: 'Playfair Display', serif;
        }

        .form-card {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-xl p-8 form-card">
        <div class="text-center mb-6">
            <h1 class="title-font text-3xl font-bold">Login</h1>
            <p class="text-gray-500 mt-2">Welcome back to Termosifone's Blog</p>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" required
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring focus:ring-indigo-200 focus:outline-none">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring focus:ring-indigo-200 focus:outline-none">
            </div>

            <div th:if="${param.error}" class="text-red-600 text-sm">
                Invalid username or password.
            </div>

            <div th:if="${param.logout}" class="text-green-600 text-sm">
                You have been logged out.
            </div>

            <button type="submit"
                    class="w-full bg-gray-800 text-white py-2 rounded-md hover:bg-gray-900 transition">
                Login
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account?
            <a href="/auth/signup" class="text-blue-600 hover:underline">Sign up</a>
        </p>
    </div>

</body>
</html>
