<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f0f0f0;
        }

        .form-container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        .message {
            text-align: center;
            margin-top: 1rem;
            color: red;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Registrati</h2>
        <form action="/auth/signup" method="post">
            <label>Inserisci nickname</label>
            <input type="text" name="username" required />
            <label>Inserisci password</label>
            <input type="password" name="password" required />

            <!-- CSRF token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <button type="submit">Crea account</button>
        </form>
        <!-- eventuale messaggio di errore -->
        <div class="message" th:if="${param.error}" th:text="'Errore: ' + ${param.error}"></div>
        <div class="message" th:if="${param.signup=='success'}">Registrazione avvenuta con successo!</div>
    </div>
</body>

</html>
