<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrazione - Termosifone's Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f5f2;
            color: #333;
        }
        .title-font {
            font-family: 'Playfair Display', serif;
        }
        .form-card {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-xl p-8 form-card">
        <div class="text-center mb-6">
            <h2 class="title-font text-3xl font-bold">Registrati</h2>
            <p class="text-gray-500 mt-2">Crea il tuo account su Termosifone's Blog</p>
        </div>

        <form th:action="@{/auth/signup}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" required
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring focus:ring-indigo-200 focus:outline-none">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring focus:ring-indigo-200 focus:outline-none">
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div th:if="${param.error}" class="text-red-600 text-sm">
                Errore: <span th:text="${param.error}"></span>
            </div>
            <div th:if="${param.signup=='success'}" class="text-green-600 text-sm">
                Registrazione avvenuta con successo!
            </div>

            <button type="submit"
                    class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition">
                Crea account
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Hai già un account?
            <a href="/auth/login" class="text-blue-600 hover:underline">Accedi</a>
        </p>
    </div>

</body>
</html>
